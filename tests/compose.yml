services:
  db:
    image: mysql:8.4
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=COP4331
      - MYSQL_USER=colors_test
      - MYSQL_PASSWORD
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -ucolors_test COP4331 -e 'SELECT COUNT(*) FROM Colors'"]
      interval: 2s
      timeout: 5s
      retries: 60

  php:
    build: .
    environment:
      - MYSQL_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ../LAMPAPI:/app/LAMPAPI:ro
      - ./database.php:/etc/colors/database.php:ro
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 2s
      timeout: 3s
      retries: 15
